<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gửi em ở Hà Nội</title>

    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./assets/css.css">
</head>
<body>

    <div id="webgl-container"></div>

    <div class="top-bar">
        <button class="icon-btn" id="audio-btn" title="Bật/Tắt Nhạc"><i class="fas fa-music"></i></button>
        <button class="icon-btn" id="reset-cam-btn" title="Góc nhìn ban đầu"><i class="fas fa-compress-arrows-alt"></i></button>
    </div>

    <div class="click-hint">Chạm vào từng chiếc đèn để đọc lời nhắn anh gửi em</div>

    <div class="wish-modal" id="wishModal">
        <div class="wish-card">
            <button class="close-btn" id="closeWishBtn" aria-label="Đóng"><i class="fas fa-times"></i></button>
            <h3 id="wishTitle">Gửi Thẻo — vợ iu của anh, người anh thương ở Hà Nội</h3>
            
            <div class="wish-image-container">
                <img id="wishImage" src="" alt="Kỷ niệm của anh và em">
            </div>

            <p id="wishText">"Thẻo à, nếu nỗi nhớ có hình dáng, chắc lúc này nó đã bay từ nơi anh đứng về Hà Nội, ôm vợ iu thật chặt rồi. Chờ anh nhé, thương em nhiều lắm."</p>
            <div class="tag">✦ Thương em từ nơi xa ✦</div>
        </div>
    </div>

    <audio id="bgm" autoplay loop playsinline preload="auto" src="./assets/1.mp3"></audio>
    
    
    <!-- Three.js & OrbitControls -->
    <script src="./assets/three.min.js"></script>
    <script src="./assets/OrbitControls.js"></script>
    <script src="./assets/script.js"></script>
</body>
</html>
